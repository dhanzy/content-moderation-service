[project]
name = "moderation-api"
version = "0.1.0"
description = "Content moderation service: screening rules, review queue, fair work queue"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "python-dotenv==1.2.4",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "anyio==4.7.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
# asyncio_mode = auto so async tests need no per-test decorator.
asyncio_mode = "auto"
# Explicit per-test loops; the db fixture disposes the engine to match.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --tb=short"
markers = [
    "incident: reproduces a symptom of the Tuesday outage (expected to fail in fixed mode)",
    "integration: needs postgres, redis and the fake provider running",
]
